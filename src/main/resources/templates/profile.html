<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(#{profile.title})}"></head>
<body>
<div th:replace="~{fragments/loader}"></div>
<div class="page">
    <header class="site-header" th:replace="~{fragments/nav :: nav(active='profile')}"></header>

    <div class="flex separate">
        <div class="flex gap-lg centered">
            <div class="avatar" th:text="${#strings.toUpperCase(#strings.substring(username, 0, 1))}">U</div>
            <div>
                <h1 class="w-100 m-0" th:text="${username}">Username</h1>
                <p th:if="${isLoggedUser}" th:text="${email}">email@example.com</p>
                <span class="date"><span th:text="#{profile.member.since}">Member since</span> <span th:text="${memberSince}">2024-01-01</span></span>
            </div>
        </div>
        <div>
            <div class="flex gap">
                <button th:if="${isLoggedUser}" id="btnOpenEditModal" type="button">
                    <i data-lucide="pencil"></i>
                </button>
                <button th:if="${isLoggedUser}" id="btnOpenLetterboxdModal" type="button" class="link secondary">
                    <i data-lucide="upload"></i>
                </button>
            </div>

            <form th:unless="${isLoggedUser}" th:action="@{/user/follow}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="id" th:value="${followId}" />
                <button th:class="${isFollowed} ? '' : 'primary'" type="submit" th:title="${isFollowed} ? #{community.unfollow} : #{community.follow}">
                    <i th:data-lucide="${isFollowed} ? 'user-round-x' : 'user-round-check'" aria-hidden="true"></i>
                </button>
            </form>
        </div>
    </div>

    <div class="separator"></div>

    <div class="grid">
        <div>
            <h2 th:text="#{profile.posts}">Posts</h2>
            <div class="card">
                <div th:each="item : ${feed}">
                    <div class="flex separate">
                        <a class="link secondary" th:href="${item.mediaType == 'movie'} ? @{'/movie/' + ${item.tmdbId}} : @{'/tv/' + ${item.tmdbId}}">
                            <span class="title" th:text="${item.title}">Title</span>
                            <br>
                            <span class="season" th:if="${item.seasonNumber != null}" th:text="#{tvshows.season.prefix} + ' ' +  ${item.seasonNumber}">S1</span>
                        </a>
                        <div>
                            <span class="rating" th:text="${#strings.replace(#numbers.formatDecimal(item.score, 1, 2), ',', '.')}">0.00</span>
                        </div>
                    </div>
                    <br>
                    <p class="m-0" th:if="${item.reviewText != null}" th:text="${item.reviewText}">Review text</p>
                    <span class="date">
                        <span th:text="#{community.activity.rated.at}">Rated on</span>
                        <span th:text="${item.ratedAt}">date</span>
                    </span>
                    <div class="separator"></div>
                </div>
                <div th:if="${hasMore}">
                    <a th:href="@{'/profile/' + ${followId}(limit=${limit + 10})}" class="link flex gap">
                        <i data-lucide="chevrons-down"></i>
                        <span th:text="#{community.load.more}">Load More</span>
                    </a>
                </div>
            </div>
        </div>

        <div>
            <h2 class="flex separate">
                <span th:text="#{profile.lists}">Lists</span>
                <button th:if="${isLoggedUser}" id="btnOpenCreateListModal" type="button">
                    <i data-lucide="list-plus"></i>
                </button>
            </h2>
            <div th:if="${#lists.isEmpty(lists)}" class="feedback info">
                <p th:text="#{profile.no.lists}">No lists yet.</p>
            </div>
            <div th:unless="${#lists.isEmpty(lists)}" class="flex" style="flex-direction: column; gap: 8px;">
                <a th:each="list : ${lists}" th:href="@{'/list/' + ${list.id.value}}" class="card">
                    <div class="flex separate">
                        <span class="title" th:text="${list.name.value}">List Name</span>
                        <span th:if="${list.isPublic}" class="tag" th:text="#{list.public}">Public</span>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <footer th:if="${isLoggedUser}" class="bmc-footer">
        <div class="flex gap-lg">
            <form th:if="${isLoggedUser}" th:action="@{/lang}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="form-group">
                    <label for="lang" th:text="#{profile.lang.label}">Language</label>
                    <select id="lang" name="lang" onchange="this.form.submit()">
                        <option value="en" th:text="#{profile.lang.en}" th:selected="${currentLang == 'en'}">English</option>
                        <option value="de" th:text="#{profile.lang.de}" th:selected="${currentLang == 'de'}">Deutsch</option>
                        <option value="es" th:text="#{profile.lang.es}" th:selected="${currentLang == 'es'}">Español</option>
                        <option value="fr" th:text="#{profile.lang.fr}" th:selected="${currentLang == 'fr'}">Français</option>
                        <option value="it" th:text="#{profile.lang.it}" th:selected="${currentLang == 'it'}">Italiano</option>
                        <option value="ja" th:text="#{profile.lang.ja}" th:selected="${currentLang == 'ja'}">日本語</option>
                        <option value="pt" th:text="#{profile.lang.pt}" th:selected="${currentLang == 'pt'}">Português</option>
                        <option value="ru" th:text="#{profile.lang.ru}" th:selected="${currentLang == 'ru'}">Русский</option>
                        <option value="zh" th:text="#{profile.lang.zh}" th:selected="${currentLang == 'zh'}">中文</option>
                    </select>
                </div>
            </form>
            <form th:if="${isLoggedUser}" th:action="@{/metadata-lang}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="form-group">
                    <label for="metadataLang" th:text="#{profile.metadata.lang.label}">Metadata Language</label>
                    <select id="metadataLang" name="metadataLang" onchange="this.form.submit()">
                        <option value="en" th:text="#{profile.lang.en}" th:selected="${currentMetadataLang == 'en'}">English</option>
                        <option value="de" th:text="#{profile.lang.de}" th:selected="${currentMetadataLang == 'de'}">Deutsch</option>
                        <option value="es" th:text="#{profile.lang.es}" th:selected="${currentMetadataLang == 'es'}">Español</option>
                        <option value="fr" th:text="#{profile.lang.fr}" th:selected="${currentMetadataLang == 'fr'}">Français</option>
                        <option value="it" th:text="#{profile.lang.it}" th:selected="${currentMetadataLang == 'it'}">Italiano</option>
                        <option value="ja" th:text="#{profile.lang.ja}" th:selected="${currentMetadataLang == 'ja'}">日本語</option>
                        <option value="pt" th:text="#{profile.lang.pt}" th:selected="${currentMetadataLang == 'pt'}">Português</option>
                        <option value="ru" th:text="#{profile.lang.ru}" th:selected="${currentMetadataLang == 'ru'}">Русский</option>
                        <option value="zh" th:text="#{profile.lang.zh}" th:selected="${currentMetadataLang == 'zh'}">中文</option>
                    </select>
                </div>
            </form>
        </div>

        <script type="text/javascript" src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js" data-name="bmc-button" data-slug="golmenero" data-color="#d97757" data-emoji="" data-font="Bree" data-text="Buy me a coffee" data-outline-color="#FFFFFF" data-font-color="#FFFFFF" data-coffee-color="#FFDD00"></script>
    </footer>

    <div th:replace="~{fragments/edit-user-modal :: editUserModal}"></div>
    <div th:if="${isLoggedUser}" th:replace="~{fragments/letterboxd-import-modal :: letterboxdImportModal}"></div>
    <div th:if="${isLoggedUser}" th:replace="~{fragments/create-list-modal :: createListModal}"></div>
</div>
</body>
<script>
    const btnOpenEditModal = document.getElementById('btnOpenEditModal');
    const btnCloseEditModal = document.getElementById('btnCloseEditModal');
    const editProfileModal = document.getElementById('editProfileModal');

    if (btnOpenEditModal) {
        btnOpenEditModal.addEventListener('click', () => editProfileModal.classList.add('visible'));
    }
    if (btnCloseEditModal) {
        btnCloseEditModal.addEventListener('click', () => editProfileModal.classList.remove('visible'));
    }

    if (editProfileModal) {
        editProfileModal.addEventListener('click', (e) => {
            if (e.target === editProfileModal) {
                editProfileModal.classList.remove('visible');
            }
        });
    }

    const btnOpenLetterboxdModal = document.getElementById('btnOpenLetterboxdModal');
    const btnCloseLetterboxdModal = document.getElementById('btnCloseLetterboxdModal');
    const letterboxdImportModal = document.getElementById('letterboxdImportModal');

    if (btnOpenLetterboxdModal) {
        btnOpenLetterboxdModal.addEventListener('click', () => letterboxdImportModal.classList.add('visible'));
    }
    if (btnCloseLetterboxdModal) {
        btnCloseLetterboxdModal.addEventListener('click', () => letterboxdImportModal.classList.remove('visible'));
    }

    if (letterboxdImportModal) {
        letterboxdImportModal.addEventListener('click', (e) => {
            if (e.target === letterboxdImportModal) {
                letterboxdImportModal.classList.remove('visible');
            }
        });
    }

    const btnOpenCreateListModal = document.getElementById('btnOpenCreateListModal');
    const btnCloseCreateListModal = document.getElementById('btnCloseCreateListModal');
    const createListModal = document.getElementById('createListModal');

    if (btnOpenCreateListModal) {
        btnOpenCreateListModal.addEventListener('click', () => createListModal.classList.add('visible'));
    }
    if (btnCloseCreateListModal) {
        btnCloseCreateListModal.addEventListener('click', () => createListModal.classList.remove('visible'));
    }

    if (createListModal) {
        createListModal.addEventListener('click', (e) => {
            if (e.target === createListModal) {
                createListModal.classList.remove('visible');
            }
        });
    }

    // File upload label update
    const fileInput = document.getElementById('file');
    const fileUploadText = document.getElementById('file-upload-text');
    if (fileInput && fileUploadText) {
        const defaultText = fileUploadText.textContent;
        fileInput.addEventListener('change', (e) => {
            const fileName = e.target.files[0]?.name;
            fileUploadText.textContent = fileName || defaultText;
        });
    }
</script>
</html>
