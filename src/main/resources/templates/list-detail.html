<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(#{list.detail.title})}"></head>
<body>
<div th:replace="~{fragments/loader}"></div>
<div class="page">
    <header class="site-header" th:replace="~{fragments/nav :: nav(active='profile')}"></header>

    <div th:if="${error}" class="feedback error" th:text="#{${error}}"></div>
    <div th:if="${success}" class="feedback success" th:text="#{${success}}"></div>

    <div th:if="${list != null}">
        <div class="card">
            <div class="flex separate">
                <div>
                    <h1 th:text="${list.name}">List Name</h1>
                    <span class="tag" th:text="#{list.public}">Public</span>
                </div>
                <div th:if="${isOwner}" class="flex">
                    <button id="btnOpenEditModal" th:aria-label="#{list.edit}">
                        <i data-lucide="edit"></i>
                    </button>
                    <form th:action="@{'/list/' + ${list.id.value} + '/delete'}" method="post" th:onsubmit="'return confirm(#{list.delete.confirm})'">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" th:aria-label="#{list.delete}">
                            <i data-lucide="trash"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(list.items)}" class="card" th:text="#{list.empty}">This list is empty.</div>

        <div class="poster-grid">
            <div th:each="item, iterStat : ${list.items}" class="poster-card" th:data-item-id="${item.id.value}">
                <a th:href="@{${item.mediaType == 'movie'} ? '/movie/' + ${item.tmdbId} : '/tvshow/' + ${item.tmdbId}}">
                    <img th:src="${item.posterPath != null} ? @{'https://image.tmdb.org/t/p/w185' + ${item.posterPath}} : @{'/images/no-poster.png'}" 
                         th:alt="${item.title}" 
                         class="poster">
                    <div class="poster-info">
                        <span class="poster-title" th:text="${item.title}">Title</span>
                        <span th:if="${item.year != null}" class="poster-year" th:text="${item.year}">2024</span>
                    </div>
                </a>
                <div th:if="${isOwner}" class="poster-actions">
                    <span class="poster-rank" th:text="${iterStat.index + 1}">1</span>
                    <form th:action="@{'/list/' + ${list.id.value} + '/item/' + ${item.id.value} + '/remove'}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="poster-remove" th:aria-label="#{list.item.remove}">
                            <i data-lucide="x"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${isOwner}" th:replace="~{fragments/edit-list-modal :: editListModal(${list})}"></div>
</div>
</body>
<script>
    const btnOpenEditModal = document.getElementById('btnOpenEditModal');
    const btnCloseEditModal = document.getElementById('btnCloseEditModal');
    const editModal = document.getElementById('editModal');

    if (btnOpenEditModal) {
        btnOpenEditModal.addEventListener('click', () => {
            editModal.classList.add('visible');
        });
    }

    if (btnCloseEditModal) {
        btnCloseEditModal.addEventListener('click', () => {
            editModal.classList.remove('visible');
        });
    }

    if (editModal) {
        editModal.addEventListener('click', (e) => {
            if (e.target === editModal) {
                editModal.classList.remove('visible');
            }
        });
    }
</script>
</html>
