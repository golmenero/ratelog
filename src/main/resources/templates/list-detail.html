<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(#{list.detail.title})}"></head>
<body>
<div th:replace="~{fragments/loader}"></div>
<div class="page">
    <header class="site-header" th:replace="~{fragments/nav :: nav(active='profile')}"></header>

    <div th:if="${error}" class="feedback error" th:text="#{${error}}"></div>
    <div th:if="${success}" class="feedback success" th:text="#{${success}}"></div>

    <div th:if="${list != null}">
        <div class="flex separate">
            <div class="flex-1" style="min-width: 0;">
                <h1 style="word-wrap: break-word; overflow-wrap: break-word;" th:text="${list.name}">List Name</h1>
            </div>
            <div th:if="${isOwner}">
                <div class="flex gap">
                    <button id="btnOpenEditModal" th:aria-label="#{list.edit}">
                        <i data-lucide="pencil"></i>
                    </button>
                    <form th:action="@{'/list/' + ${list.id.value} + '/delete'}" method="post" th:onsubmit="'return confirm(#{list.delete.confirm})'">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" th:aria-label="#{list.delete}">
                            <i data-lucide="trash"></i>
                        </button>
                    </form>
                </div>
                <div>
                    <span th:if="${list.isPublic}" class="tag" th:text="#{list.public}">Public</span>
                </div>
            </div>
        </div>

        <div th:text="#{list.empty}" th:if="${#lists.isEmpty(list.items)}" class="empty-state"></div>

        <div class="list-grid">
            <a th:each="item, iterStat : ${list.items}"
               th:href="${item.mediaType == 'movie'} ? @{/movie/{id}(id=${item.tmdbId})} : @{/tv/{id}(id=${item.tmdbId})}"
               class="list-card" th:data-item-id="${item.id.value}">
                <div class="poster-frame">
                    <span class="tag type-tag" th:text="${item.mediaType == 'movie'} ? #{search.type.movie} : #{search.type.tv}">Type</span>
                    <img th:if="${item.posterPath != null}" th:src="@{'https://image.tmdb.org/t/p/w185' + ${item.posterPath}}" th:alt="'Poster of ' + ${item.title}">
                    <div th:unless="${item.posterPath != null}" class="poster-fallback" th:text="${#strings.toUpperCase(#strings.substring(item.title, 0, 1))}">?</div>
                </div>
                <div class="list-content">
                    <h3>
                        <span th:text="${item.title}">Title</span>
                        <span class="year" th:text="${item.year != null} ? ${item.year} : #{movies.year.unknown}">Year</span>
                    </h3>
                    <form th:if="${isOwner}" th:onclick="event.stopPropagation()" th:action="@{'/list/' + ${list.id.value} + '/item/' + ${item.id.value} + '/remove'}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" th:aria-label="#{list.item.remove}">
                            <i data-lucide="trash"></i>
                        </button>
                    </form>
                </div>
            </a>
        </div>
    </div>

    <div th:if="${isOwner}" th:replace="~{fragments/edit-list-modal :: editListModal(${list})}"></div>
</div>
</body>
<script>
    const btnOpenEditModal = document.getElementById('btnOpenEditModal');
    const btnCloseEditModal = document.getElementById('btnCloseEditModal');
    const editModal = document.getElementById('editModal');

    if (btnOpenEditModal) {
        btnOpenEditModal.addEventListener('click', () => {
            editModal.classList.add('visible');
        });
    }

    if (btnCloseEditModal) {
        btnCloseEditModal.addEventListener('click', () => {
            editModal.classList.remove('visible');
        });
    }

    if (editModal) {
        editModal.addEventListener('click', (e) => {
            if (e.target === editModal) {
                editModal.classList.remove('visible');
            }
        });
    }
</script>
</html>
