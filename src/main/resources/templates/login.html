<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(#{auth.login.title})}"></head>
<body>
<div th:replace="~{fragments/loader}"></div>
<div class="page">
    <header class="site-header" th:replace="~{fragments/nav :: nav(active='login')}"></header>

    <div th:if="${param.error}"  class="feedback error" th:text="#{auth.login.error}"></div>
    <div th:if="${param.logout}" class="feedback success" th:text="#{auth.logout.success}"></div>

    <section class="card centered">
        <h2 th:text="#{auth.signin}">Sign in</h2>

        <form th:action="@{/login/process}" class="w-100" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="username" th:text="#{auth.username.or.email}">Username or Email</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password" th:text="#{auth.password}">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="remember-me" name="remember-me">
                <label for="remember-me" th:text="#{auth.remember.me}">Remember me</label>
            </div>

            <button type="submit" class="primary w-100" th:text="#{auth.signin.btn}">Sign In</button>
        </form>

        <br>

        <div class="flex gap">
            <span th:text="#{auth.no.account}">Don't have an account?</span>
            <a class="link highlighted" th:href="@{/register}" th:text="#{auth.signup}">Sign up</a>
        </div>
    </section>

    <br>

    <section class="card centered">
        <h3 th:text="#{install.title}">Install mobile app</h3>
        <div class="install-icons">
            <button id="btnOpenIosModal" class="install-icon-btn" th:aria-label="#{install.ios}">
                <i data-lucide="apple"></i>
            </button>
            <button id="btnOpenAndroidModal" class="install-icon-btn" th:aria-label="#{install.android}">
                <i data-lucide="smartphone"></i>
            </button>
        </div>
    </section>
</div>
<div th:replace="~{fragments/install-ios-modal :: installIosModal}"></div>
<div th:replace="~{fragments/install-android-modal :: installAndroidModal}"></div>
<script>
    (function() {
        var iosModal = document.getElementById('installIosModal');
        var btnOpenIos = document.getElementById('btnOpenIosModal');
        var btnCloseIos = document.getElementById('btnCloseIosModal');

        if (btnOpenIos && iosModal) {
            btnOpenIos.addEventListener('click', function() { iosModal.classList.add('visible'); });
        }
        if (btnCloseIos && iosModal) {
            btnCloseIos.addEventListener('click', function() { iosModal.classList.remove('visible'); });
        }
        if (iosModal) {
            iosModal.addEventListener('click', function(e) {
                if (e.target === iosModal) iosModal.classList.remove('visible');
            });
        }

        var androidModal = document.getElementById('installAndroidModal');
        var btnOpenAndroid = document.getElementById('btnOpenAndroidModal');
        var btnCloseAndroid = document.getElementById('btnCloseAndroidModal');

        if (btnOpenAndroid && androidModal) {
            btnOpenAndroid.addEventListener('click', function() { androidModal.classList.add('visible'); });
        }
        if (btnCloseAndroid && androidModal) {
            btnCloseAndroid.addEventListener('click', function() { androidModal.classList.remove('visible'); });
        }
        if (androidModal) {
            androidModal.addEventListener('click', function(e) {
                if (e.target === androidModal) androidModal.classList.remove('visible');
            });
        }
    })();
</script>
</body>
</html>
