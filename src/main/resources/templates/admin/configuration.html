<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(#{admin.title})}"></head>
<body>
<div th:replace="~{fragments/loader}"></div>
<div class="page">
    <header class="site-header" th:replace="~{fragments/nav :: nav(active='admin')}"></header>

    <div th:if="${success}" class="feedback success" th:text="#{${success}}"></div>
    <div th:if="${error}" class="feedback error" th:text="#{${error}}"></div>

    <h1 th:text="#{config.title}">Configuration</h1>

    <h2 th:text="#{config.general}">General</h2>
    <section class="card">
        <form th:action="@{/admin/configuration/general}" method="post" class="form-general-config">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="key" value="tmdb_api_key" />

            <div class="form-group">
                <label for="tmdbApiKey" th:text="#{config.general.tmdb.api.key.label}">TMDB API Key</label>
                <input type="password"
                       id="tmdbApiKey"
                       name="value"
                       autocomplete="new-password"
                       th:value="${tmdbApiKeyValue}" />
                <p class="help-text" th:text="#{config.general.tmdb.api.key.help}">
                    Used by Ratelog to search and fetch metadata from TMDB.
                </p>
            </div>

            <button type="submit" class="primary" th:text="#{config.general.save}">Save</button>
        </form>
    </section>

    <br>

    <h2 th:text="#{config.users.title}">Users</h2>

    <div class="user-cards">
        <div th:each="u : ${users}" class="card user-card">
            <div class="flex centered gap">
                <div class="avatar sm" th:text="${#strings.toUpperCase(#strings.substring(u.username.value, 0, 1))}">U</div>
                <div class="flex-1 user-card-info ellipsis">
                    <span class="title" th:text="${u.username.value}">username</span>
                    <span class="date" th:text="${u.email.value}">email@example.com</span>
                </div>
                <th:block th:switch="${u.role.name()}">
                    <span th:case="'SUPERADMIN'" class="pill superadmin" th:text="#{admin.user.role.superadmin}">Superadmin</span>
                    <span th:case="'ADMIN'" class="pill admin" th:text="#{admin.user.role.admin}">Admin</span>
                    <span th:case="'USER'" class="pill user" th:text="#{admin.user.role.user}">User</span>
                </th:block>
            </div>
            <div class="separator"></div>
            <div class="flex separate">
                <span class="date" th:text="${#dates.format(u.createdAtEpochMs, 'yyyy-MM-dd')}">2024-01-01</span>
                <div class="flex gap">
                    <a th:href="@{'/profile/' + ${u.id.value}}" class="btn" th:aria-label="#{admin.user.view.profile}">
                        <i data-lucide="eye"></i>
                    </a>
                    <button type="button" class="open-edit-user"
                            th:data-id="${u.id.value}"
                            th:data-username="${u.username.value}"
                            th:data-email="${u.email.value}"
                            th:data-role="${u.role.name()}"
                            th:aria-label="#{admin.user.edit}"
                            th:if="${currentUserRole == 'SUPERADMIN' or u.role.name() == 'USER'}">
                        <i data-lucide="pencil"></i>
                    </button>
                    <form class="delete-user-form inline" th:action="@{'/admin/users/' + ${u.id.value} + '/delete'}" method="post"
                          th:data-confirm="#{admin.user.delete.confirm}"
                          th:if="${
                              u.id.value != currentUserId and (
                                  (currentUserRole == 'SUPERADMIN' and u.role.name() != 'SUPERADMIN')
                                  or
                                  (currentUserRole == 'ADMIN' and u.role.name() == 'USER')
                              )
                          }">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="danger" th:aria-label="#{admin.user.delete}">
                            <i data-lucide="trash-2"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <button id="btnOpenCreateUserModal" type="button" class="user-card-add" th:aria-label="#{admin.user.create}">
            <i data-lucide="user-plus"></i>
            <span th:text="#{admin.user.create}">Create user</span>
        </button>
    </div>
</div>

<div th:replace="~{fragments/admin-create-user-modal :: createUserModal}"></div>
<div th:replace="~{fragments/admin-edit-user-modal :: editUserModal}"></div>
<script>
    (function() {
        var editForm = document.getElementById('editUserForm');
        var roleSection = document.getElementById('editRoleSection');

        document.querySelectorAll('.open-edit-user').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var modal = document.getElementById('editUserModal');
                if (!modal) return;
                var id = btn.dataset.id;
                if (editForm) editForm.action = '/admin/users/' + id;
                modal.querySelector('input[name="username"]').value = btn.dataset.username;
                modal.querySelector('input[name="email"]').value = btn.dataset.email;
                var roleSelect = modal.querySelector('select[name="role"]');
                if (roleSelect) roleSelect.value = btn.dataset.role;
                if (roleSection) roleSection.style.display = btn.dataset.role === 'SUPERADMIN' ? 'none' : '';
                modal.classList.add('visible');
            });
        });

        var create = document.getElementById('createUserModal');
        var openCreate = document.getElementById('btnOpenCreateUserModal');
        var closeCreate = document.getElementById('btnCloseCreateUserModal');
        if (openCreate && create) openCreate.addEventListener('click', function() { create.classList.add('visible'); });
        if (closeCreate && create) closeCreate.addEventListener('click', function() { create.classList.remove('visible'); });
        if (create) create.addEventListener('click', function(e) { if (e.target === create) create.classList.remove('visible'); });

        var edit = document.getElementById('editUserModal');
        var closeEdit = document.getElementById('btnCloseEditUserModal');
        if (closeEdit && edit) closeEdit.addEventListener('click', function() { edit.classList.remove('visible'); });
        if (edit) edit.addEventListener('click', function(e) { if (e.target === edit) edit.classList.remove('visible'); });

        document.querySelectorAll('.delete-user-form').forEach(function(form) {
            form.addEventListener('submit', function(e) {
                var msg = form.dataset.confirm;
                if (msg && !confirm(msg)) e.preventDefault();
            });
        });
    })();
</script>
</body>
</html>
