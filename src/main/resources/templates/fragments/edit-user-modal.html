<div th:fragment="editUserModal(action, withRole)" id="editUserModal" class="modal medium" data-modal="editUserModal">
    <div class="modal-content card">
        <div class="flex separate">
            <h3 class="m-0" th:text="#{admin.user.edit}">Edit user</h3>
            <button type="button" data-close-modal th:aria-label="#{modal.close}">
                <i data-lucide="x"></i>
            </button>
        </div>

        <form id="editUserForm" method="post" th:action="@{${action}}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="editUsername" th:text="#{admin.user.username}">Username</label>
                <input type="text" id="editUsername" name="username" th:value="${username}" required minlength="3" maxlength="50">
            </div>

            <div class="form-group">
                <label for="editEmail" th:text="#{admin.user.email}">Email</label>
                <input type="email" id="editEmail" name="email" th:value="${email}" required>
            </div>

            <div class="form-group" th:unless="${#authorization.expression('hasRole(''SUPERADMIN'')')}">
                <label for="currentPassword" th:text="#{profile.current.password}">Current Password</label>
                <input type="password" id="currentPassword" name="currentPassword" autocomplete="current-password" required>
            </div>

            <div class="form-group">
                <label for="editPassword" th:text="#{admin.user.new.password}">New password</label>
                <input type="password" id="editPassword" name="newPassword" autocomplete="new-password">
                <p class="help-text" th:text="#{admin.user.password.hint}">Leave empty to keep current</p>
            </div>

            <div id="editRoleSection" class="form-group"
                 th:if="${withRole and #authorization.expression('hasRole(''SUPERADMIN'')')}">
                <label for="editRole" th:text="#{admin.user.role}">Role</label>
                <select id="editRole" name="role" required>
                    <option value="USER" th:text="#{admin.user.role.user}">User</option>
                    <option value="ADMIN" th:text="#{admin.user.role.admin}">Admin</option>
                </select>
            </div>

            <button type="submit" class="primary w-100" th:text="#{admin.user.save}">Save</button>
        </form>
    </div>

    <script>
        (function () {
            const modal = document.getElementById('editUserModal');
            if (!modal) return;

            modal.addEventListener('modal:open', function (e) {
                const trigger = e.detail.trigger;
                if (!trigger || !trigger.dataset.id) return;

                const form = modal.querySelector('#editUserForm');
                const roleSection = modal.querySelector('#editRoleSection');

                if (form) form.action = '/admin/users/' + trigger.dataset.id;
                const usernameInput = modal.querySelector('input[name="username"]');
                const emailInput = modal.querySelector('input[name="email"]');
                if (usernameInput) usernameInput.value = trigger.dataset.username || '';
                if (emailInput) emailInput.value = trigger.dataset.email || '';
                modal.querySelectorAll('input[name="currentPassword"], input[name="newPassword"]').forEach((input) => {
                    input.value = '';
                });

                const roleSelect = modal.querySelector('select[name="role"]');
                const isSuperadminTarget = trigger.dataset.role === 'SUPERADMIN';
                if (roleSelect) {
                    roleSelect.disabled = isSuperadminTarget;
                    if (!isSuperadminTarget) roleSelect.value = trigger.dataset.role || 'USER';
                }
                if (roleSection) roleSection.style.display = isSuperadminTarget ? 'none' : '';
            });
        })();
    </script>
</div>
