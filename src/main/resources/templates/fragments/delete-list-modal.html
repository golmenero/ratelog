<div th:fragment="deleteListModal(list)" th:if="${list != null}" id="deleteListModal" class="modal medium" data-modal="deleteListModal">
    <div>
        <div class="flex separate top">
            <h2 th:text="#{list.delete.title}">Delete list</h2>
            <button type="button" data-close-modal th:aria-label="#{modal.close}">
                <i data-lucide="x"></i>
            </button>
        </div>

        <p th:text="#{list.delete.confirm}">Are you sure?</p>

        <form th:action="@{'/list/' + ${list.id.value} + '/delete'}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="confirm-modal-actions">
                <button type="submit" class="danger w-100" th:text="#{modal.confirm}">Confirm</button>
                <button type="button" class="secondary w-100" data-close-modal th:text="#{modal.cancel}">Cancel</button>
            </div>
        </form>
    </div>
</div>
