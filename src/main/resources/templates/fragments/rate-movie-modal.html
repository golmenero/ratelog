<div th:fragment="rateMovieModal(movie)" th:if="${movie != null}" id="rateModal" class="modal">
    <div>
        <div class="flex separate top">
            <h2 th:text="${movie.name}">Movie Title</h2>
            <button id="btnCloseModal" type="button" th:aria-label="#{modal.close}">
                <i data-lucide="x"></i>
            </button>
        </div>

        <div class="rating-modal-summary">
            <span class="rating-modal-summary-label" th:text="#{modal.overall}">Overall</span>
            <span class="rating-modal-summary-value" id="ratingOverallValue">5.00</span>
            <span class="rating-modal-summary-max">/ 10</span>
        </div>

        <form th:action="@{/movie/rate}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="movieId" th:value="${movie.id}">
            <input type="hidden" name="tmdbId" th:value="${movie.tmdbId}">

            <div th:replace="~{fragments/rate-slider :: rateSlider('directing', 'modal.direction')}"></div>
            <div th:replace="~{fragments/rate-slider :: rateSlider('cinematography', 'modal.photography')}"></div>
            <div th:replace="~{fragments/rate-slider :: rateSlider('acting', 'modal.acting')}"></div>
            <div th:replace="~{fragments/rate-slider :: rateSlider('soundtrack', 'modal.soundtrack')}"></div>
            <div th:replace="~{fragments/rate-slider :: rateSlider('screenplay', 'modal.script')}"></div>

            <div class="separator"></div>

            <div class="rate-modal-review">
                <label for="review" class="rate-modal-label">
                    <i data-lucide="message-square"></i>
                    <span th:text="#{modal.review}">Review</span>
                </label>
                <textarea id="review" name="review" rows="4" maxlength="1000" th:placeholder="#{modal.review.placeholder}"></textarea>
            </div>

            <button class="primary w-100" type="submit" th:text="#{profile.save}">Save</button>
        </form>
    </div>
</div>
