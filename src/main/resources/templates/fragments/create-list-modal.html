<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<body>
<div th:fragment="createListModal" id="createListModal" class="modal">
    <div class="modal-content">
        <div class="flex separate">
            <h2 th:text="#{list.create}">Create List</h2>
            <button id="btnCloseCreateListModal" th:aria-label="#{modal.close}">
                <i data-lucide="x"></i>
            </button>
        </div>
        <form th:action="@{/list}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="form-group">
                <label for="listName" th:text="#{list.name.placeholder}">List name</label>
                <input type="text" id="listName" name="name" required maxlength="100" th:placeholder="#{list.name.placeholder}">
            </div>
            <div class="form-group">
                <label class="flex gap">
                    <input type="checkbox" name="isPublic" value="true">
                    <span th:text="#{list.public}">Public</span>
                </label>
            </div>
            <button type="submit" class="primary" th:text="#{list.create}">Create</button>
        </form>
    </div>
</div>
</body>
</html>
