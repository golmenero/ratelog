<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<body>
<div th:fragment="editListModal(list)" id="editModal" class="modal">
    <div class="modal-content">
        <div class="flex separate">
            <h2 th:text="#{list.edit}">Edit List</h2>
            <button id="btnCloseEditModal" th:aria-label="#{modal.close}">
                <i data-lucide="x"></i>
            </button>
        </div>
        <form th:action="@{'/list/' + ${list.id.value} + '/edit'}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="form-group">
                <label for="editListName" th:text="#{list.name.placeholder}">List name</label>
                <input type="text" id="editListName" name="name" th:value="${list.name}" required maxlength="100" th:aria-label="#{list.name.placeholder}">
            </div>
            <div class="form-group">
                <label class="flex gap">
                    <input type="checkbox" name="isPublic" value="true" th:checked="${list.isPublic}">
                    <span th:text="#{list.public}">Public</span>
                </label>
            </div>
            <button type="submit" class="primary" th:text="#{list.save}">Save</button>
        </form>
    </div>
</div>
</body>
</html>
