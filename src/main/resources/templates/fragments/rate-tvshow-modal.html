<div th:fragment="rateTvShowModal(show)" th:if="${show != null}" id="rateTvShowModal" class="modal" data-modal="rateTvShowModal">
    <div>
        <div class="flex separate top">
            <h2 th:text="${show.name}">TV Show Title</h2>
            <button type="button" data-close-modal th:aria-label="#{modal.close}">
                <i data-lucide="x"></i>
            </button>
        </div>

        <div class="rating-modal-summary">
            <span class="rating-modal-summary-label" th:text="#{modal.overall}">Overall</span>
            <span class="rating-modal-summary-value rating-overall-value">5.00</span>
            <span class="rating-modal-summary-max">/ 10</span>
        </div>

        <form th:action="@{/tv/rate}" method="post" data-create-action="/tv/rate" data-update-action="/tv/rate/update">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="tvShowId" th:value="${show.id}">
            <input type="hidden" name="tmdbId" th:value="${show.tmdbId}">
            <input type="hidden" id="seasonNumber" name="seasonNumber">

            <div th:replace="~{fragments/rate-slider :: rateSlider('directing', 'tvshows.rating.category.directing')}"></div>
            <div th:replace="~{fragments/rate-slider :: rateSlider('cinematography', 'tvshows.rating.category.cinematography')}"></div>
            <div th:replace="~{fragments/rate-slider :: rateSlider('acting', 'tvshows.rating.category.acting')}"></div>
            <div th:replace="~{fragments/rate-slider :: rateSlider('soundtrack', 'tvshows.rating.category.soundtrack')}"></div>
            <div th:replace="~{fragments/rate-slider :: rateSlider('screenplay', 'tvshows.rating.category.screenplay')}"></div>

            <div class="rate-modal-review">
                <label for="review" class="rate-modal-label" th:text="#{modal.review}">Review</label>
                <textarea id="review" name="review" rows="4" maxlength="1000" th:placeholder="#{modal.review.placeholder}"></textarea>
            </div>

            <button class="primary w-100" type="submit" th:text="#{profile.save}">Save</button>
        </form>
    </div>

    <script>
        (function () {
            const CATEGORIES = ['directing', 'cinematography', 'acting', 'soundtrack', 'screenplay'];
            const DEFAULT_SCORE = 5;
            const modal = document.getElementById('rateTvShowModal');
            if (!modal) return;

            function setSlider(name, value) {
                if (value === undefined || value === null || value === '') return;
                const slider = modal.querySelector('.rate-slider[data-name="' + name + '"]');
                if (slider && window.rateLogSliders) window.rateLogSliders.set(slider, value);
            }

            function resetSliders() {
                CATEGORIES.forEach((name) => setSlider(name, DEFAULT_SCORE));
            }

            function fillSliders(data) {
                CATEGORIES.forEach((name) => setSlider(name, data[name]));
            }

            function setReview(value) {
                const review = modal.querySelector('textarea[name="review"]');
                if (review) review.value = value || '';
            }

            function setSeason(value) {
                const season = modal.querySelector('input[name="seasonNumber"]');
                if (season && value !== undefined && value !== null && value !== '') season.value = value;
            }

            modal.addEventListener('modal:open', function (e) {
                const trigger = e.detail.trigger;
                const form = modal.querySelector('form');
                const mode = trigger?.dataset.modalMode || 'create';

                if (form) {
                    form.action = mode === 'edit' ? form.dataset.updateAction : form.dataset.createAction;
                }

                setSeason(trigger?.dataset.season);

                if (mode === 'edit' && trigger) {
                    setReview(trigger.dataset.review);
                    fillSliders(trigger.dataset);
                } else {
                    setReview('');
                    resetSliders();
                }
            });
        })();
    </script>
</div>
