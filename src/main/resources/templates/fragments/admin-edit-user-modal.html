<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<body>
<div th:fragment="editUserModal" id="editUserModal" class="modal">
    <div class="modal-content card">
        <div class="flex separate">
            <h3 class="m-0" th:text="#{admin.user.edit}">Edit user</h3>
            <button id="btnCloseEditUserModal" type="button" th:aria-label="#{modal.close}">
                <i data-lucide="x"></i>
            </button>
        </div>

        <form id="editUserForm" method="post" th:action="@{/admin/users/0}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="editUsername" th:text="#{admin.user.username}">Username</label>
                <input type="text" id="editUsername" name="username" required minlength="3" maxlength="50">
            </div>

            <div class="form-group">
                <label for="editEmail" th:text="#{admin.user.email}">Email</label>
                <input type="email" id="editEmail" name="email" required>
            </div>

            <div class="form-group">
                <label for="editPassword" th:text="#{admin.user.new.password}">New password</label>
                <input type="password" id="editPassword" name="password" autocomplete="new-password" minlength="8">
                <p class="help-text" th:text="#{admin.user.password.hint}">Leave empty to keep current</p>
                <p class="help-text" th:text="#{password.help}">Min 8 characters, with uppercase, number and special character.</p>
            </div>

            <div id="editRoleSection" class="form-group" th:if="${#authorization.expression('hasRole(''SUPERADMIN'')')}">
                <label for="editRole" th:text="#{admin.user.role}">Role</label>
                <select id="editRole" name="role" required>
                    <option value="USER" th:text="#{admin.user.role.user}">User</option>
                    <option value="ADMIN" th:text="#{admin.user.role.admin}">Admin</option>
                </select>
            </div>

            <button type="submit" class="primary w-100" th:text="#{admin.user.save}">Save</button>
        </form>
    </div>
</div>
</body>
</html>
