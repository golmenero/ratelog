<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<body>
<div th:fragment="editUserModal" id="editUserModal" class="modal">
    <div class="modal-content card">
        <div class="flex separate">
            <h3 class="m-0" th:text="#{admin.user.edit}">Edit user</h3>
            <button id="btnCloseEditUserModal" type="button" th:aria-label="#{modal.close}">
                <i data-lucide="x"></i>
            </button>
        </div>

        <form id="editCredentialsForm" method="post" th:action="@{/admin/users/0/credentials}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="editUsername" th:text="#{admin.user.username}">Username</label>
                <input type="text" id="editUsername" name="username" required minlength="3" maxlength="50">
            </div>

            <div class="form-group">
                <label for="editPassword" th:text="#{admin.user.new.password}">New password</label>
                <input type="password" id="editPassword" name="password" autocomplete="new-password">
            </div>

            <button type="submit" class="primary w-100" th:text="#{admin.user.save}">Save</button>
        </form>

        <div class="separator"></div>

        <form id="editRoleForm" method="post" th:action="@{/admin/users/0/role}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="editRole" th:text="#{admin.user.role}">Role</label>
                <select id="editRole" name="role" required>
                    <option value="USER" th:text="#{admin.user.role.user}">User</option>
                    <option value="ADMIN" th:text="#{admin.user.role.admin}">Admin</option>
                    <option value="SUPERADMIN" th:text="#{admin.user.role.superadmin}"
                            th:disabled="${!#authorization.expression('hasRole(''SUPERADMIN'')')}">Superadmin</option>
                </select>
            </div>

            <p class="hint" th:if="${!#authorization.expression('hasRole(''SUPERADMIN'')')}"
               th:text="#{admin.role.superadmin.note}">Superadmin can only be assigned by another superadmin.</p>

            <button type="submit" class="primary w-100" th:text="#{admin.user.save}">Save</button>
        </form>
    </div>
</div>
</body>
</html>
