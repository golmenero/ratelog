<div th:fragment="confirmModal(titleKey, messageKey)" class="modal" id="confirmModal" data-modal="confirmModal">
    <div>
        <div class="flex separate top">
            <h2 th:text="#{${titleKey}}">Confirm</h2>
            <button type="button" data-close-modal th:aria-label="#{modal.close}">
                <i data-lucide="x"></i>
            </button>
        </div>

        <p th:text="#{${messageKey}}">Are you sure?</p>

        <div class="confirm-modal-actions">
            <button id="btnAcceptConfirmModal" type="button" class="danger w-100" th:text="#{modal.confirm}">Confirm</button>
            <button id="btnCancelConfirmModal" type="button" class="secondary w-100" th:text="#{modal.cancel}">Cancel</button>
        </div>
    </div>
</div>
<script>
    (function () {
        const modal = document.getElementById('confirmModal');
        const acceptBtn = document.getElementById('btnAcceptConfirmModal');
        if (!modal || !acceptBtn) return;

        let pendingForm = null;
        modal.addEventListener('modal:open', function (e) {
            pendingForm = e.detail.trigger?.closest('form') || null;
        });
        modal.addEventListener('modal:close', function () {
            pendingForm = null;
        });
        acceptBtn.addEventListener('click', function () {
            if (pendingForm) pendingForm.submit();
            window.Modals.close('confirmModal');
        });
    })();
</script>
