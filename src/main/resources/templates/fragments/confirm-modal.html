<div th:fragment="confirmModal(titleKey, messageKey)" class="modal" id="confirmModal">
    <div>
        <div class="flex separate top">
            <h2 th:text="#{${titleKey}}">Confirm</h2>
            <button id="btnCloseConfirmModal" type="button" th:aria-label="#{modal.close}">
                <i data-lucide="x"></i>
            </button>
        </div>

        <p class="confirm-modal-message" th:text="#{${messageKey}}">Are you sure?</p>

        <div class="confirm-modal-actions">
            <button id="btnAcceptConfirmModal" type="button" class="danger w-100" th:text="#{modal.confirm}">Confirm</button>
            <button id="btnCancelConfirmModal" type="button" class="secondary w-100" th:text="#{modal.cancel}">Cancel</button>
        </div>
    </div>
</div>
