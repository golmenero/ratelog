<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<body>
<div th:fragment="createUserModal" id="createUserModal" class="modal">
    <div class="modal-content card">
        <div class="flex separate">
            <h3 class="m-0" th:text="#{admin.user.create}">Create user</h3>
            <button id="btnCloseCreateUserModal" type="button" th:aria-label="#{modal.close}">
                <i data-lucide="x"></i>
            </button>
        </div>

        <form th:action="@{/admin/users/create}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="newUsername" th:text="#{admin.user.username}">Username</label>
                <input type="text" id="newUsername" name="username" required minlength="3" maxlength="50">
            </div>

            <div class="form-group">
                <label for="newEmail" th:text="#{admin.user.email}">Email</label>
                <input type="email" id="newEmail" name="email" required>
            </div>

            <div class="form-group">
                <label for="newPassword" th:text="#{admin.user.password}">Password</label>
                <input type="password" id="newPassword" name="password" required>
            </div>

            <div class="form-group">
                <label for="newRole" th:text="#{admin.user.role}">Role</label>
                <select id="newRole" name="role" required>
                    <option value="USER" th:text="#{admin.user.role.user}">User</option>
                    <option value="ADMIN" th:text="#{admin.user.role.admin}">Admin</option>
                </select>
            </div>

            <button type="submit" class="primary w-100" th:text="#{admin.user.save}">Save</button>
        </form>
    </div>
</div>
</body>
</html>
