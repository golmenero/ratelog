<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<body>
<div th:fragment="addToListModal(mediaId, mediaType)" id="addToListModal" class="modal">
    <div class="modal-content">
        <div class="flex separate">
            <h2 th:text="#{list.add.to}">Add to List</h2>
            <button id="btnCloseAddToListModal" th:aria-label="#{modal.close}">
                <i data-lucide="x"></i>
            </button>
        </div>
        <div th:text="#{list.no.lists}" th:if="${#lists.isEmpty(userLists)}" class="empty-state"></div>
        <div th:unless="${#lists.isEmpty(userLists)}" class="list-selection">
            <form th:each="list : ${userLists}" th:action="@{'/list/' + ${list.id.value} + '/item'}" method="post" class="list-selection-item">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="mediaId" th:value="${mediaId}" />
                <input type="hidden" name="mediaType" th:value="${mediaType}" />
                <button type="submit" class="primary w-100">
                    <span class="list-selection-name" th:text="${list.name.value}">List Name</span>
                </button>
                <div class="separator"></div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
