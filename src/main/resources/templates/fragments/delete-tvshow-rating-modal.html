<div th:fragment="deleteTvShowSeasonRatingModal(show, season, modalId)" th:if="${show != null}" th:id="${modalId}" class="modal" th:attr="data-modal=${modalId}">
    <div>
        <div class="flex separate top">
            <h2 th:text="#{rating.delete.title}">Delete rating</h2>
            <button type="button" data-close-modal th:aria-label="#{modal.close}">
                <i data-lucide="x"></i>
            </button>
        </div>

        <p th:text="#{rating.delete.confirm}">Are you sure?</p>

        <form th:action="@{'/tvshows/delete/' + ${show.id}}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="seasonNumber" th:value="${season.seasonNumber}" />

            <div class="confirm-modal-actions">
                <button type="submit" class="danger w-100" th:text="#{modal.confirm}">Confirm</button>
                <button type="button" class="secondary w-100" data-close-modal th:text="#{modal.cancel}">Cancel</button>
            </div>
        </form>
    </div>
</div>
