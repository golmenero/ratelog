<div th:fragment="deleteTvShowRatingModal(show)" th:if="${show != null}" id="deleteTvShowRatingModal" class="modal medium" data-modal="deleteTvShowRatingModal">
    <div>
        <div class="flex separate top">
            <h2 th:text="#{rating.delete.title}">Delete rating</h2>
            <button type="button" data-close-modal th:aria-label="#{modal.close}">
                <i data-lucide="x"></i>
            </button>
        </div>

        <p th:text="#{rating.delete.confirm}">Are you sure?</p>

        <form th:action="@{'/tvshows/delete/' + ${show.id}}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" id="deleteSeasonNumber" name="seasonNumber" />

            <div class="confirm-modal-actions">
                <button type="submit" class="danger w-100" th:text="#{modal.confirm}">Confirm</button>
                <button type="button" class="secondary w-100" data-close-modal th:text="#{modal.cancel}">Cancel</button>
            </div>
        </form>
    </div>

    <script>
        const modal = document.getElementById('deleteTvShowRatingModal');

        modal.addEventListener('modal:open', function (e) {
            const input = modal.querySelector('input[name="seasonNumber"]');
            const season = e.detail.trigger?.dataset.season;
            if (input && season !== undefined && season !== null && season !== '') input.value = season;
        });
    </script>
</div>
